name: 缺陷报告
description: 记录可复现的产品、数据、认证、离线或部署问题。
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "请勿粘贴家庭口令、session token、Webhook URL、用户家庭数据或其他敏感信息。"
  - type: textarea
    id: observed
    attributes:
      label: 实际发生了什么？
      description: 描述用户可见行为、错误文案或数据异常。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 如何复现？
      description: 从哪个页面开始、执行了什么操作、使用什么条件。
      placeholder: "1. 打开…\n2. 点击…\n3. 看到…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 首页推荐
        - 冰箱或采购
        - 菜谱
        - 家庭口令或登录
        - 离线同步
        - D1 数据
        - 部署或公开访问
        - 其他
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 设备、浏览器、网络状态和发生时间。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我确认未提交口令、Token 或家庭私有数据。
          required: true
